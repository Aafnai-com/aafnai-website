
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Site Under Construction</title>
  <meta name="description" content="We're building something awesome. Coming soon!" />
  <!-- Favicon placeholder (replace with your URL) -->
  <link rel="icon" href="favicon.ico" />
  <style>
    :root{
      --bg1: #0f172a;
      --bg2: #002044;
      --accent: #ffb86b;
      --muted: rgba(255,255,255,0.75);
      --glass: rgba(255,255,255,0.06);
      --radius: 16px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: linear-gradient(135deg,var(--bg1), var(--bg2));
      color: #f8fafc;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.35;
    }

    .card{
      width:100%;
      max-width:980px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius: var(--radius);
      padding:32px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.6);
      display:grid;
      grid-template-columns: 1fr 420px;
      gap:28px;
      align-items:center;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.03);
    }

    @media (max-width:900px){
      .card{grid-template-columns:1fr; padding:20px}
    }

    .left {
      padding-right:12px;
    }

    h1{
      margin:0 0 6px 0;
      font-size: clamp(20px, 3.2vw, 34px);
      letter-spacing:-0.02em;
    }

    p.lead{
      margin:6px 0 20px 0;
      color:var(--muted);
      max-width:54ch;
    }

    /* Construction SVG container */
    .illustration{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:16px;
    }

    .hardhat{
      width:84px;
      height:84px;
      flex:0 0 84px;
      border-radius:12px;
      background: linear-gradient(180deg,#ffd59a 0%, #ffb86b 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      transform-origin:center;
      animation: bob 2.8s ease-in-out infinite;
    }
    @keyframes bob{
      0%{transform: translateY(0)}
      50%{transform: translateY(-6px)}
      100%{transform: translateY(0)}
    }

    .progress-wrap{
      margin-top:8px;
    }
    .progress-bar {
      width:100%;
      background:var(--glass);
      height:16px;
      border-radius:999px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .progress-fill {
      height:100%;
      width:0%;
      border-radius:999px;
      background: linear-gradient(90deg, #ffd59a, #ffb86b 60%, #ff8a5b);
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding-right:8px;
      color: #0b0b0b;
      font-weight:600;
      font-size:12px;
      transition: width 0.6s cubic-bezier(.2,.9,.2,1);
    }
    .meta{
      display:flex;
      gap:12px;
      margin-top:14px;
      align-items:center;
      flex-wrap:wrap;
    }
    .meta small{color:var(--muted); font-size:13px}

    /* Right column / card */
    .right{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      padding:18px;
      border-radius:12px;
      border: 1px solid rgba(255,255,255,0.02);
    }
    label{display:block; font-size:13px; margin-bottom:8px; color:var(--muted)}
    input[type="email"]{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.04);
      background: rgba(0,0,0,0.25);
      color: #fff;
      outline:none;
      font-size:14px;
      margin-bottom:12px;
    }
    .btn {
      display:inline-block;
      background: linear-gradient(90deg,#ffb86b,#ff8a5b);
      border: none;
      padding:10px 16px;
      border-radius:10px;
      color:#081018;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
      font-size:14px;
    }
    .socials{display:flex; gap:10px; margin-top:12px}
    .socials a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:40px;
      height:40px;
      border-radius:10px;
      background: rgba(255,255,255,0.03);
      text-decoration:none;
      color:var(--muted);
      border: 1px solid rgba(255,255,255,0.02);
    }

    footer.small {
      margin-top:18px;
      font-size:12px;
      color:var(--muted);
    }

    .tagline{
      display:inline-block;
      padding:6px 10px;
      background:rgba(0,0,0,0.14);
      border-radius:999px;
      font-weight:600;
      font-size:13px;
      color:var(--muted);
      border:1px solid rgba(255,255,255,0.02);
    }

    .note{
      margin-top:14px;
      color:var(--muted);
      font-size:13px;
    }
  </style>
</head>
<body>

    <section class="left" aria-hidden="false">
      <div class="illustration" role="img" aria-label="Construction icon">
        <div class="hardhat" title="We're building!">

            <path d="M10 26C18 22 46 22 54 26" stroke="#FF8A5B" stroke-width="3" stroke-linecap="round"/>

          <h1 id="title">Site Under Construction</h1>
          <p class="lead">We're putting the final bricks in place. New site launching soon — sign up to get updates and a first look.</p>

              <div
